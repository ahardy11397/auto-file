[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto_file"
version = "0.1.0"
description = "Automated, 100% local file sorting, renaming, and organization system"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
    "pypdf",
    "pillow",
    "puremagic",
    "watchdog",
    "pytest",
    "mutagen>=1.48.1",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0",
]

# The in-process transformers backend needs multi-gigabyte local weights and
# a CUDA-capable torch. It is opt-in: the default install stays small, and
# the primary LLM path (llama.cpp) needs none of these.
[project.optional-dependencies]
llm = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=5.0",
    "accelerate",
    "bitsandbytes>=0.45",
    "sentencepiece",
    "protobuf",
]

[project.scripts]
auto-file = "auto_file.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
